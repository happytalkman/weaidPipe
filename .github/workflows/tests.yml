name: Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # 현재 단위 테스트는 표준 라이브러리만 사용한다.
      # (무거운 의존성이 필요한 테스트를 추가할 경우 여기에 설치 단계를 둔다)
      - name: Unit tests
        run: python -m unittest discover -s tests -v
